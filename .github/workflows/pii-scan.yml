name: PII Scan

# Defense-in-depth complement to the local pre-commit hook (#314). The local
# hook can fail silently — wrong git env, --no-verify, malformed patterns
# array. This workflow scans the PR diff against patterns from a GitHub
# Secret, so a defect in the local hook doesn't leave us unprotected.
#
# The secret PII_PATTERNS_REGEX holds one regex per line — same format as
# the local hook's PATTERNS array (sans bash quoting). GitHub does not pass
# Actions secrets to a pull request from a fork, nor to a run that Dependabot
# triggers. In those two cases the job passes, but its summary and a warning
# say the scan did not run, and the maintainer scans the diff locally before
# merging (docs/maintainers/fork-pull-requests.md, #1223). Failing them would
# block every external contribution and every Dependabot bump. On any other
# pull request a missing secret is a misconfiguration, so the job fails.
#
# Do not move this workflow to `pull_request_target` to get the secret: that
# event runs the contributor's code with this repository's secrets.
#
# Security note: the ${{ }} interpolations in this file are the secret and
# two booleans computed from the event (fork / Dependabot). All three reach
# the shell via `env:`, never substituted into a run: command. No untrusted
# string from the event payload (PR title/body/branch name/etc.) is used in
# any shell command.

on:
  pull_request:
    branches: [main]

# Least-privilege default token: this workflow only reads the PR diff to scan
# for PII. It needs no write scope. #962
permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Diff PR against main
        id: diff
        run: |
          set -euo pipefail
          git fetch origin main:main 2>/dev/null || true
          git diff origin/main...HEAD --diff-filter=ACMR -U0 \
            | grep '^+' \
            | grep -v '^+++' \
            > /tmp/pr_added_lines.txt || true
          line_count=$(wc -l < /tmp/pr_added_lines.txt)
          echo "Scanning $line_count added lines"

      - name: Scan against PII patterns
        env:
          PATTERNS: ${{ secrets.PII_PATTERNS_REGEX }}
          # A missing head repository (a deleted fork) counts as a fork.
          IS_FORK_PR: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          IS_DEPENDABOT: ${{ github.actor == 'dependabot[bot]' }}
        run: |
          set -euo pipefail
          if [ -z "${PATTERNS:-}" ]; then
            if [ "$IS_FORK_PR" = "true" ] || [ "$IS_DEPENDABOT" = "true" ]; then
              if [ "$IS_FORK_PR" = "true" ]; then
                why="This pull request comes from a fork"
              else
                why="Dependabot triggered this run"
              fi
              echo "::warning::PII scan did not run: ${why}, and GitHub does not pass the PII_PATTERNS_REGEX secret to it."
              echo "::warning::Before merging, scan the diff locally: docs/maintainers/fork-pull-requests.md"
              {
                echo "## PII scan did not run"
                echo ""
                echo "${why}, and GitHub does not pass the \`PII_PATTERNS_REGEX\` secret to it. This check is green, but **nothing was scanned**."
                echo ""
                echo "**Maintainer:** before merging, scan this pull request's diff with your local pre-commit hook. The steps are in \`docs/maintainers/fork-pull-requests.md\`."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::error::PII_PATTERNS_REGEX secret is not set. A same-repository pull request must be scanned."
            echo "::error::Install the secret per docs/operations/config-reference.md (CI-side defense)."
            {
              echo "## PII scan failed: secret missing"
              echo ""
              echo "The \`PII_PATTERNS_REGEX\` secret is not set, so this same-repository pull request could not be scanned. Install it per \`docs/operations/config-reference.md\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [ ! -s /tmp/pr_added_lines.txt ]; then
            echo "No added lines in PR diff — nothing to scan."
            exit 0
          fi

          found=0
          while IFS= read -r pattern; do
            [ -z "$pattern" ] && continue
            case "$pattern" in '#'*) continue ;; esac

            if grep -qiE "$pattern" /tmp/pr_added_lines.txt; then
              echo "::error::PR diff matches PII pattern: $pattern"
              found=1
            fi
          done <<< "$PATTERNS"

          if [ "$found" -eq 1 ]; then
            echo ""
            echo "::error::One or more PII patterns matched. Find and remove the matching content."
            echo "::error::To audit your branch locally: bash .git/hooks/pre-commit (after staging)."
            exit 1
          fi

          echo "Clean — no PII matches in $(wc -l < /tmp/pr_added_lines.txt) added lines."
