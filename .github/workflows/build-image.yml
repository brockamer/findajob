name: Build and push image

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

# Serialize per-ref so two pushes to the same branch / tag never race on
# `:latest` (or `:pr-{N}`). Earlier runs finish; later runs queue rather than
# clobber. Without this, two main merges in close succession can publish
# `:latest` pointing at the second-to-finish push instead of HEAD (#438).
concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # QEMU enables arm64 emulation on the amd64 runner so buildx produces a
      # manifest list covering both architectures from a single job. Native
      # arm64 runners would be faster but require self-hosted infra; qemu
      # emulation is the right default at our build cadence.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          IMAGE="ghcr.io/${REPO_OWNER}/findajob"
          TAGS=""
          if [[ "${GITHUB_REF}" == refs/tags/v*.*.* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"              # v0.1.3
            MINOR="${VERSION%.*}"                            # v0.1
            TAGS="${IMAGE}:${VERSION},${IMAGE}:${MINOR},${IMAGE}:latest"
          elif [[ "${GITHUB_REF}" == refs/heads/main ]]; then
            SHA="${GITHUB_SHA::7}"
            TAGS="${IMAGE}:main-${SHA},${IMAGE}:latest"
          elif [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            # PR builds publish only :pr-{N} — :latest stays aligned with main HEAD.
            # The PR-branch image lets pre-merge walkthrough verification
            # (e.g. findajob-test) run against the actual PR code.
            TAGS="${IMAGE}:pr-${PR_NUMBER}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "Will push: ${TAGS}"

      - name: Build and push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT

  # Auto-deploy the freshly-published tagged image to the maintainer's own Fly
  # apps, then run the mandated post-deploy auth-gate verify. `needs: build-push`
  # guarantees the image exists on GHCR first; the tag gate means PR and main
  # builds never trigger a deploy. Driven entirely by two repo secrets:
  # FLY_DEPLOY_APPS (app slugs) + FLY_API_TOKEN — both unset => clean no-op, so
  # this job is inert on forks and on instances that don't opt in (#914).
  deploy-fly:
    needs: build-push
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Least-privilege: this job only reads the repo (checkout). Fly auth comes
    # from FLY_API_TOKEN, not GITHUB_TOKEN — no packages:write needed here.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6

      # IMAGE re-derives the immutable version tag from the git ref (e.g.
      # v0.33.0) — the exact tag build-push just published — rather than :latest,
      # so a near-simultaneous main push moving :latest can't divert the deploy.
      - name: Deploy tagged image to maintainer Fly apps + verify auth gate
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_DEPLOY_APPS: ${{ secrets.FLY_DEPLOY_APPS }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/findajob:${{ github.ref_name }}
        run: bash ops/ci-fly-deploy.sh
